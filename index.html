<style>
  :root{
    --bg:#ffffff; --fg:#253349; --muted:#627086; --border:#dce3ec;
    --sidebar:#f3f6fa; --accent:#315fc0; --hover:#e7edf5; --active:#e2ebfc;
    --code-bg:#f6f8fa; --warn-bg:#fff8c5; --warn-border:#d4a72c; --warn-fg:#633c01;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --border:#30363d;
      --sidebar:#161b22; --accent:#2f81f7; --hover:#21262d; --active:#1f3556;
      --code-bg:#161b22; --warn-bg:#3a2d06; --warn-border:#9e6a03; --warn-fg:#f2cc60;
    }
    /* highlight.js GitHub Dark overrides */
    .hljs{color:#c9d1d9;background:transparent}
    .hljs-doctag,.hljs-keyword,.hljs-meta .hljs-keyword,.hljs-template-tag,.hljs-template-variable,.hljs-type,.hljs-variable.language_{color:#ff7b72}
    .hljs-title,.hljs-title.class_,.hljs-title.class_.inherited__,.hljs-title.function_{color:#d2a8ff}
    .hljs-attr,.hljs-attribute,.hljs-literal,.hljs-meta,.hljs-number,.hljs-operator,.hljs-selector-attr,.hljs-selector-class,.hljs-selector-id,.hljs-variable{color:#79c0ff}
    .hljs-meta .hljs-string,.hljs-regexp,.hljs-string{color:#a5d6ff}
    .hljs-built_in,.hljs-symbol{color:#ffa657}
    .hljs-code,.hljs-comment,.hljs-formula{color:#8b949e}
    .hljs-name,.hljs-quote,.hljs-selector-pseudo,.hljs-selector-tag{color:#7ee787}
    .hljs-subst{color:#c9d1d9}
    .hljs-section{color:#1f6feb;font-weight:700}
    .hljs-bullet{color:#f2cc60}
    .hljs-emphasis{color:#c9d1d9;font-style:italic}
    .hljs-strong{color:#c9d1d9;font-weight:700}
    .hljs-addition{color:#aff5b4;background-color:#033a16}
    .hljs-deletion{color:#ffdcd7;background-color:#67060c}
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.55}
  #app{display:flex;height:100%}
  #sidebar{width:var(--sidebar-w,280px);flex-shrink:0;
    background:var(--sidebar);
    display:flex;flex-direction:column;min-width:0}
  .resizer{flex-shrink:0;position:relative;z-index:2;
    background:var(--border);touch-action:none;user-select:none}
  .resizer.v{width:1px;cursor:col-resize}
  .resizer.v::before{content:"";position:absolute;top:0;bottom:0;
    left:-3px;right:-3px}
  .resizer.v:hover,.resizer.v.dragging{background:var(--accent);width:3px;margin:0 -1px}
  .resizer:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #splitResizer{display:none}
  #body.split #splitResizer{display:block}
  #sidebar header{padding:14px 16px;border-bottom:1px solid var(--border);
    display:flex;flex-direction:column;gap:8px}
  #sidebar h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.02em;
    color:var(--muted);text-transform:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:6px 10px;border:1px solid var(--border);border-radius:6px;
    background:var(--bg);color:var(--fg);cursor:pointer;font-size:13px;
    font-weight:500;white-space:nowrap}
  .btn:hover{background:var(--hover)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(0.95)}
  .btn.small{padding:4px 8px;font-size:12px}
  .btn svg{width:14px;height:14px;flex-shrink:0}
  .btn.small svg{width:13px;height:13px}
  .btn.busy svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .seg .btn{border:none;border-radius:0}
  .seg .btn+.btn{border-left:1px solid var(--border)}
  .seg .btn.on{background:var(--active);color:var(--accent);font-weight:600}
  #files{flex:1;overflow:auto;padding:6px}
  .file-item{display:flex;align-items:center;gap:8px;padding:7px 10px;
    border-radius:6px;cursor:pointer;font-size:13px;color:var(--fg);
    user-select:none}
  .file-item:hover{background:var(--hover)}
  .file-item.active{background:var(--active);color:var(--accent);font-weight:600}
  .file-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .file-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-item .dot{width:8px;height:8px;border-radius:50%;background:var(--warn-border);
    visibility:hidden;flex-shrink:0}
  .file-item.dirty .dot{visibility:visible}
  .file-item .close{opacity:0;border:none;background:transparent;color:inherit;
    cursor:pointer;padding:0 4px;font-size:16px;line-height:1}
  .file-item:hover .close,.file-item.active .close,
  .file-item:focus-within .close{opacity:.7}
  .file-item .close:hover,.file-item .close:focus-visible{opacity:1}
  .file-item .close:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
  .empty{padding:20px;color:var(--muted);font-size:13px;text-align:center}

  #main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  #dropzone{position:fixed;inset:0;display:none;align-items:center;
    justify-content:center;background:rgba(9,105,218,.08);
    border:3px dashed var(--accent);pointer-events:none;z-index:10;
    color:var(--accent);font-size:20px;font-weight:600}
  #dropzone.active{display:flex}

  #toolbar{background:var(--bg);border-bottom:1px solid var(--border);
    padding:8px 16px;display:flex;align-items:center;gap:10px;font-size:13px;
    color:var(--muted);flex-shrink:0}
  #toolbar .size{flex-shrink:0}
  #findBar{display:flex;align-items:center;flex-wrap:wrap;flex-shrink:0;gap:6px;padding:6px 12px;
    background:var(--sidebar);border-bottom:1px solid var(--border)}
  #findText{flex:1 1 130px;min-width:0;max-width:330px;min-height:32px;padding:4px 8px;
    border:1px solid var(--border);border-radius:var(--ui-radius);font:inherit;color:var(--fg);background:var(--bg)}
  #findStatus{font-size:12px;color:var(--muted)}
  ::highlight(document-current){color:var(--bg);background:var(--accent)}
  #pinLineBtn[aria-pressed="true"]{background:var(--active);color:var(--accent)}
  .source-measure{position:fixed;left:-10000px;top:0;visibility:hidden;box-sizing:border-box}
  #warnBar{background:var(--warn-bg);border-bottom:1px solid var(--warn-border);
    color:var(--warn-fg);padding:8px 16px;font-size:13px;display:none}
  #warnBar.show{display:block}
  #warnBar strong{font-weight:600}

  #body{flex:1;overflow:auto;position:relative}
  #body.split{display:flex;overflow:hidden}
  #editor{display:none;width:100%;height:100%;border:0;resize:none;
    padding:24px 32px;background:var(--bg);color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;
    line-height:1.6;outline:none;tab-size:2}
  #body.edit #editor{display:block}
  #body.split #editor{flex:0 0 var(--split-w,50%);display:block;min-width:0}
  #body.edit #content{display:none}
  #body.split #content{flex:1 1 0;overflow:auto;min-width:0}
  #wysiwyg{display:none;min-height:100%;outline:none}
  #body.wysiwyg{overflow:auto}
  #body.wysiwyg #content{display:none}
  #body.wysiwyg #wysiwyg{display:block}
  #wysiwyg:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  #richToolbar{display:none;align-items:center;gap:6px;flex-wrap:wrap;
    padding:6px 16px;border-bottom:1px solid var(--border);background:var(--sidebar)}
  #richToolbar.show{display:flex}
  #richToolbar.source-only > :not([data-rich-cmd="codeBlock"],[data-history]){display:none}
  .editor-dialog{width:min(540px,calc(100% - 32px));padding:20px;
    background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:var(--ui-radius)}
  .editor-dialog::backdrop{background:#0006}
  .editor-dialog form{display:grid;gap:8px}
  .editor-dialog h2{font-size:18px;margin:0 0 4px}
  .editor-dialog :is(input,textarea){width:100%;padding:8px;background:var(--sidebar);
    color:var(--fg);border:1px solid var(--border);border-radius:var(--ui-radius);font:inherit}
  #codeBlockDialog textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;tab-size:2}
  .editor-dialog .btn-row{justify-content:flex-end;margin-top:8px}
  #richToolbar select{height:28px;border:1px solid var(--border);border-radius:6px;
    background:var(--bg);color:var(--fg);font-size:12px;padding:0 8px}

  .welcome{max-width:640px;margin:60px auto;padding:0 32px;color:var(--muted)}
  .welcome h2{color:var(--fg);font-weight:600;margin-top:0}
  .welcome kbd{background:var(--sidebar);border:1px solid var(--border);
    border-radius:4px;padding:2px 6px;font-size:12px;font-family:ui-monospace,
    SFMono-Regular,Menlo,monospace;color:var(--fg)}

  #content,#wysiwyg{max-width:900px;margin:0 auto;padding:32px 48px 120px}
  #body.split #content{max-width:none;margin:0;padding:24px 32px}
  #content h1,#content h2,#content h3,#content h4,#content h5,#content h6,
  #wysiwyg h1,#wysiwyg h2,#wysiwyg h3,#wysiwyg h4,#wysiwyg h5,#wysiwyg h6{
    margin-top:1.5em;margin-bottom:.6em;font-weight:600;line-height:1.25}
  #content h1,#wysiwyg h1{font-size:2em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
  #content h2,#wysiwyg h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
  #content h3,#wysiwyg h3{font-size:1.25em}
  #content h4,#wysiwyg h4{font-size:1em}
  #content p,#content ul,#content ol,#content blockquote,#content pre,#content table,
  #wysiwyg p,#wysiwyg ul,#wysiwyg ol,#wysiwyg blockquote,#wysiwyg pre,#wysiwyg table{margin:0 0 16px}
  #content ul,#content ol,#wysiwyg ul,#wysiwyg ol{padding-left:2em}
  #content li+li,#wysiwyg li+li{margin-top:.25em}
  #content li>p,#wysiwyg li>p{margin-top:16px}
  #content blockquote,#wysiwyg blockquote{padding:0 1em;color:var(--muted);border-left:.25em solid var(--border)}
  #content a,#wysiwyg a{color:var(--accent);text-decoration:none}
  #content a:hover,#wysiwyg a:hover{text-decoration:underline}
  #content hr,#wysiwyg hr{height:.25em;padding:0;margin:24px 0;background:var(--border);border:0}
  #content code,#wysiwyg code{background:var(--code-bg);padding:.2em .4em;border-radius:6px;
    font-size:85%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #content pre,#wysiwyg pre{background:var(--code-bg);padding:16px;border-radius:6px;
    overflow:auto;font-size:85%;line-height:1.45}
  #content pre code,#wysiwyg pre code{background:transparent;padding:0;font-size:100%}
  #content table,#wysiwyg table{border-collapse:collapse;display:block;overflow:auto;width:max-content;max-width:100%}
  #content th,#content td,#wysiwyg th,#wysiwyg td{border:1px solid var(--border);padding:6px 13px}
  #content tr:nth-child(2n),#wysiwyg tr:nth-child(2n){background:var(--sidebar)}
  #content img,#wysiwyg img{max-width:100%;border-radius:6px}
  #content input[type=checkbox],#wysiwyg input[type=checkbox]{margin-right:.4em}
  #content .task-list-item,#wysiwyg .task-list-item{list-style:none;margin-left:-1.5em}

  /* Workspace design tokens and responsive presentation. Keep runtime offline. */
  :root{--reading-width:860px;--ui-radius:8px;color-scheme:light dark}
  html,body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
  #sidebar header{padding:24px 18px 18px;gap:22px;border-bottom:0}
  #sidebar h1{display:flex;align-items:center;gap:10px;color:var(--fg);font-size:16px;letter-spacing:-.4px}
  .brand-mark{width:32px;height:32px;flex-shrink:0;background:var(--brand-image) center/contain no-repeat}
  .sidebar-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #app.menu-collapsed #sidebar{width:auto}
  #app.menu-collapsed .sidebar-heading{flex-direction:column}
  #app.menu-collapsed :is(#newBtn,#clearBtn,#openBtnLabel,.files-label,#files,.sidebar-footer,#sideResizer,.brand-name){display:none}
  .btn{min-height:34px;border-radius:var(--ui-radius);font-family:inherit}
  .btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .btn.small{min-height:32px}
  .btn-row{gap:7px}
  #openBtn{flex:1}
  .files-label{padding:8px 22px;color:var(--muted);font-size:12px;font-weight:600}
  #files{padding:0 10px 12px}
  .file-item{padding:10px 9px;margin-bottom:3px;min-height:40px;border:1px solid transparent}
  .file-item.active{border-color:var(--border);box-shadow:inset 3px 0 var(--accent)}
  .file-item .name{white-space:normal;overflow-wrap:anywhere}
  .empty{text-align:left;padding:12px;color:var(--muted)}
  .sidebar-footer{padding:16px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .sidebar-footer svg{width:14px;height:14px;flex-shrink:0}
  #toolbar{padding:12px 20px;gap:12px;flex-wrap:wrap}
  #openFileSelect{display:none;flex:1 1 120px;min-width:0;max-width:100%;min-height:32px;
    padding:4px 8px;border:1px solid var(--border);border-radius:var(--ui-radius);
    background:var(--bg);color:var(--fg);font:inherit;font-size:inherit;text-overflow:ellipsis}
  .view-as{position:relative}
  .view-as:has(select:focus-visible){outline:2px solid var(--accent);outline-offset:3px}
  .view-as svg.chevron{width:9px}
  #viewAs{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  #app.menu-collapsed #openFileSelect{display:block}
  .seg{padding:3px;gap:2px;border:0;background:var(--sidebar);border-radius:10px}
  .seg .btn{background:transparent;border-radius:7px;padding:5px 10px;color:var(--muted)}
  .seg .btn+.btn{border-left:0}
  .seg .btn.on{background:var(--bg);color:var(--accent);box-shadow:0 1px 3px #182b461c}
  #downloadBtn{background:var(--bg);color:var(--fg);border-color:var(--border)}
  #downloadBtn:hover{background:var(--hover)}
  #content,#wysiwyg{max-width:var(--reading-width);padding:40px 48px 100px;font-size:16px;line-height:1.75;overflow-wrap:anywhere}
  #content>:first-child,#wysiwyg>:first-child{margin-top:0}
  #content h1,#wysiwyg h1{font-size:2.2em;letter-spacing:-1.1px;padding-bottom:.5em}
  #content h2,#wysiwyg h2{font-size:1.45em;letter-spacing:-.4px;border-bottom:0}
  #content blockquote,#wysiwyg blockquote{border-left:3px solid var(--accent);background:var(--sidebar);padding:12px 18px;border-radius:0 8px 8px 0}
  #content blockquote>:last-child,#wysiwyg blockquote>:last-child{margin-bottom:0}
  #content pre,#wysiwyg pre{border:1px solid var(--border);border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
  #content pre code.hljs,#wysiwyg pre code.hljs{overflow:visible;white-space:pre-wrap}
  #editor{background:var(--sidebar);line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
  #editor:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
  #content.welcome{max-width:640px;margin:clamp(32px,12vh,120px) auto 0;padding:32px 40px}
  .welcome-icon{width:64px;height:72px;border:1px solid var(--border);border-radius:10px;display:grid;place-items:center;color:var(--accent);background:var(--sidebar);margin-bottom:28px;font-size:23px;font-weight:700;box-shadow:5px 5px 0 var(--sidebar)}
  #content.welcome h2{font-size:32px;letter-spacing:-1px;margin:0 0 16px;line-height:1.2}
  #content.welcome .intro{font-size:16px;max-width:420px;margin-bottom:26px}
  .welcome-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
  .welcome-actions .btn{padding:9px 16px;font-size:14px}
  .welcome-shortcuts{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:12px;padding-top:22px;border-top:1px solid var(--border)}
  .welcome-shortcuts span{display:flex;align-items:center;gap:8px}
  @media(max-width:850px){
    #sidebar{width:min(var(--sidebar-w,230px),32vw)}
    #sidebar header{padding:18px 12px;gap:16px}
    #sidebar h1{font-size:14px}
    #toolbar{gap:8px;padding:10px 12px}
    #content,#wysiwyg{padding:28px 26px 80px}
    #body.split #content,#editor{padding:22px}
  }
  @media(max-width:560px){
    #app{flex-direction:column;height:100dvh}
    #sidebar{width:100%;max-height:180px;flex-shrink:0;border-bottom:1px solid var(--border)}
    #sidebar header{flex-direction:row;align-items:center;justify-content:space-between;padding:12px;gap:8px;flex-wrap:wrap}
    #app.menu-collapsed .sidebar-heading{flex-direction:row;flex:1}
    #app.menu-collapsed .brand-name{display:inline}
    #sidebar h1{font-size:13px;gap:7px}.brand-mark{width:28px;height:28px}
    #sidebar .btn{padding:6px 8px}#clearBtn{display:none}
    .files-label,.sidebar-footer,#sideResizer{display:none}
    #files:has(.empty){display:none}
    #files{max-height:84px;padding:0 10px 6px}
    .file-item{padding:6px 9px;min-height:34px}
    #main{min-height:0}
    #content.welcome{margin:24px auto 0;padding:24px}
    #content.welcome h2{font-size:28px}
    #content,#wysiwyg{padding:24px 20px 60px}
    #body.split{flex-direction:column}
    #body.split #editor{flex:0 0 42%;min-height:0;width:100%}
    #body.split #content{min-height:0;width:100%;border-top:1px solid var(--border)}
    #body.split #splitResizer{display:none}
    #toolbar .size{display:none}
  }
  @media(prefers-reduced-motion:reduce){.btn.busy svg{animation:none}}

  .hidden{display:none !important}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <div class="sidebar-heading">
        <h1 aria-label="Editor"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Editor</span></h1>
        <button class="btn small" id="sidebarToggle" aria-expanded="true" aria-controls="newBtn clearBtn files"
                title="Contraer menú" aria-label="Contraer menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
      </div>
      <div class="btn-row" id="sidebarActions">
        <button class="btn primary" id="openBtn" title="Abrir archivos" aria-label="Abrir archivos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span id="openBtnLabel">Abrir archivos</span></button>
        <button class="btn" id="newBtn" title="Nuevo archivo" aria-label="Nuevo archivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></button>
        <button class="btn" id="clearBtn" title="Cerrar todos los archivos" aria-label="Cerrar todos los archivos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
    </header>
    <div class="files-label">Tus archivos</div>
    <div id="files" role="list"></div>
    <div class="sidebar-footer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Los archivos se mantienen en este equipo.</div>
    <input type="file" id="fileInput" multiple hidden>
  </aside>
  <div id="sideResizer" class="resizer v" role="separator"
       aria-orientation="vertical" aria-label="Cambiar el ancho del menú"
       tabindex="0"></div>
  <main id="main">
    <div id="toolbar" class="hidden">
      <div class="seg" id="modeSeg" role="group" aria-label="Modo de edición">
        <button class="btn small on" data-mode="view" aria-pressed="true" title="Vista previa" aria-label="Vista previa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="btn small" data-mode="split" aria-pressed="false" title="Dividida" aria-label="Dividida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/></svg></button>
        <button class="btn small" data-mode="edit" aria-pressed="false" title="Fuente" aria-label="Fuente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
        <button class="btn small" data-mode="wysiwyg" aria-pressed="false" title="Visual" aria-label="Visual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
      </div>
      <label class="view-as btn small">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18h1.5a1.5 1.5 0 0 0 1.1-2.5 1.5 1.5 0 0 1 1.1-2.5H18a3 3 0 0 0 3-3c0-5.5-4-10-9-10Z"/><path d="M7.5 12h.01M10 8h.01M14 7.5h.01M17.5 11h.01"/></svg>
        <svg class="chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 4 4 4 4-4"/></svg>
        <select id="viewAs" aria-label="Ver como…">
          <option value="">Markdown renderizado</option>
          <option value="plaintext">Texto sin formato</option>
        </select>
      </label>
      <select id="openFileSelect" aria-label="Archivos abiertos"></select>
      <span class="size" id="curSize"></span>
      <button class="btn small" id="findBtn" title="Buscar en el documento" aria-label="Buscar en el documento" aria-controls="findBar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
      <button class="btn small" id="pinLineBtn" title="Anclar línea" aria-label="Anclar línea" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-1 6 4 4v2H5v-2l4-4-1-6ZM12 15v6"/></svg></button>
      <button class="btn small" id="goLineBtn" title="Ir a la línea anclada o volver" aria-label="Ir a la línea anclada o volver" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></svg></button>
      <button class="btn small" id="previousFileBtn" title="Volver al archivo anterior" aria-label="Volver al archivo anterior" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 10-5 5 5 5M4 15h12a4 4 0 0 0 0-8h-4"/></svg></button>
      <button class="btn small" id="reloadBtn" title="Recargar desde el archivo original" aria-label="Recargar desde el archivo original"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
      <button class="btn small" id="saveBtn" title="Guardar en el archivo original" aria-label="Guardar en el archivo original"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg><span id="saveAsLabel" hidden>Guardar como</span></button>
      <button class="btn small primary" id="downloadBtn" title="Descargar una copia" aria-label="Descargar una copia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span id="downloadLabel" hidden>Descargar copia</span></button>
    </div>
    <div id="findBar" class="hidden" role="search" aria-label="Buscar en el documento">
      <input id="findText" type="search" placeholder="Buscar en el documento" aria-label="Texto a buscar" autocomplete="off" spellcheck="false">
      <span id="findStatus" role="status"></span>
      <button class="btn small" id="findPrev" title="Coincidencia anterior" aria-label="Coincidencia anterior" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 15 7-7 7 7"/></svg></button>
      <button class="btn small" id="findNext" title="Coincidencia siguiente" aria-label="Coincidencia siguiente" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></button>
      <button class="btn small" id="findClose" title="Cerrar búsqueda" aria-label="Cerrar búsqueda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div id="warnBar" role="alert" aria-live="polite">
      <strong>Cambios sin guardar.</strong>
      <span id="warnMsg">Los cambios están en esta pestaña. Usa <em>Descargar</em> para conservarlos.</span>
    </div>
    <div id="richToolbar" aria-label="Herramientas de edición">
      <button id="undoBtn" class="btn small" data-history="undo" title="Deshacer" aria-label="Deshacer" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 14-5-5 5-5M4 9h10a5 5 0 0 1 0 10h-3"/></svg></button>
      <button id="redoBtn" class="btn small" data-history="redo" title="Rehacer" aria-label="Rehacer" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5m5 5H10a5 5 0 0 0 0 10h3"/></svg></button>
      <select id="blockFmt" title="Estilo de bloque" aria-label="Estilo de bloque">
        <option value="p">Párrafo</option>
        <option value="h1">Título 1</option>
        <option value="h2">Título 2</option>
        <option value="h3">Título 3</option>
        <option value="blockquote">Cita</option>
        <option value="pre">Texto preformateado</option>
      </select>
      <button class="btn small" data-rich-cmd="bold" title="Negrita" aria-label="Negrita"><strong>N</strong></button>
      <button class="btn small" data-rich-cmd="italic" title="Cursiva" aria-label="Cursiva"><em>C</em></button>
      <button class="btn small" data-rich-cmd="code" title="Código en línea" aria-label="Código en línea"><code>`</code></button>
      <button class="btn small" data-rich-cmd="codeBlock">Bloque de código</button>
      <button class="btn small" data-rich-cmd="link" title="Enlace" aria-label="Enlace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
      <button class="btn small" data-rich-cmd="ul" title="Lista con viñetas" aria-label="Lista con viñetas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
      <button class="btn small" data-rich-cmd="ol" title="Lista numerada" aria-label="Lista numerada"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11"/><path d="M10 12h11"/><path d="M10 18h11"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg></button>
    </div>
    <div id="body">
      <textarea id="editor" spellcheck="false" placeholder="# Empieza a escribir en Markdown" aria-label="Editor de código Markdown"></textarea>
      <div id="splitResizer" class="resizer v" role="separator"
           aria-orientation="vertical" aria-label="Cambiar el tamaño del editor y la vista previa"
           tabindex="0"></div>
      <div id="content" class="welcome"></div>
      <div id="wysiwyg" contenteditable="true" spellcheck="true" aria-label="Editor visual de Markdown"></div>
    </div>
  </main>
  <dialog class="editor-dialog" id="codeBlockDialog" aria-labelledby="codeBlockTitle">
    <form method="dialog">
      <h2 id="codeBlockTitle">Bloque de código</h2>
      <label for="codeLanguage">Lenguaje</label>
      <input id="codeLanguage" list="codeLanguages" pattern="[A-Za-z0-9_\-]*"
             placeholder="Automático (opcional)" spellcheck="false">
      <datalist id="codeLanguages"></datalist>
      <label for="codeBlockText">Código</label>
      <textarea id="codeBlockText" rows="8" spellcheck="false" autofocus></textarea>
      <div class="btn-row">
        <button class="btn" value="cancelar" formnovalidate>Cancelar</button>
        <button class="btn primary" value="aplicar">Aplicar</button>
      </div>
    </form>
  </dialog>
  <dialog class="editor-dialog" id="linkDialog" aria-labelledby="linkDialogTitle">
    <form method="dialog">
      <h2 id="linkDialogTitle">Editor</h2>
      <label for="linkUrl">URL del enlace</label>
      <input id="linkUrl" spellcheck="false" autofocus>
      <label id="linkTextField">Texto del enlace <input id="linkText"></label>
      <div class="btn-row">
        <button class="btn primary" value="aplicar">Aplicar</button>
        <button class="btn" value="cancelar">Cancelar</button>
      </div>
    </form>
  </dialog>
  <div id="dropzone">Suelta aquí los archivos de texto</div>
</div>
<script>
(() => {
  const files = [];
  const recentFileIds = [];
  let localFileQueue = Promise.resolve();
  let activeId = null;
  let nextId = 1;
  let mode = 'view';                // 'view' | 'split' | 'edit' | 'wysiwyg'
  let renderTimer = null;

  const $files    = document.getElementById('files');
  const $content  = document.getElementById('content');
  const $editor   = document.getElementById('editor');
  const $wysiwyg  = document.getElementById('wysiwyg');
  const $body     = document.getElementById('body');
  const $toolbar  = document.getElementById('toolbar');
  const $curSize  = document.getElementById('curSize');
  const $openFileSelect = document.getElementById('openFileSelect');
  const $viewAs = document.getElementById('viewAs');
  const $previousFileBtn = document.getElementById('previousFileBtn');
  const $findBtn = document.getElementById('findBtn');
  const $findBar = document.getElementById('findBar');
  const $findText = document.getElementById('findText');
  const $findStatus = document.getElementById('findStatus');
  const $findPrev = document.getElementById('findPrev');
  const $findNext = document.getElementById('findNext');
  const $pinLineBtn = document.getElementById('pinLineBtn');
  const $goLineBtn = document.getElementById('goLineBtn');
  const $drop     = document.getElementById('dropzone');
  const $input    = document.getElementById('fileInput');
  const $warnBar  = document.getElementById('warnBar');
  const $warnMsg  = document.getElementById('warnMsg');
  const $modeSeg  = document.getElementById('modeSeg');
  const $visualMode = $modeSeg.querySelector('[data-mode="wysiwyg"]');
  const $richToolbar = document.getElementById('richToolbar');
  const $undoBtn = document.getElementById('undoBtn');
  const $redoBtn = document.getElementById('redoBtn');
  const $codeBlockDialog = document.getElementById('codeBlockDialog');
  const $linkDialog = document.getElementById('linkDialog');
  const $linkUrl = document.getElementById('linkUrl');
  const $linkText = document.getElementById('linkText');
  const $linkTextField = document.getElementById('linkTextField');
  const $codeLanguage = document.getElementById('codeLanguage');
  const $codeBlockText = document.getElementById('codeBlockText');
  const $codeLanguages = document.getElementById('codeLanguages');
  const languages = hljs.listLanguages().sort().map(id => ({
    id,
    name: id === 'markdown' ? 'Markdown (código fuente)' : hljs.getLanguage(id).name || id,
  }));
  const languageIds = new Map(languages.map(({ id }) => [hljs.getLanguage(id), id]));
  for (const { id } of languages) $codeLanguages.append(new Option(id));
  for (const { id, name } of languages.sort((a, b) => a.name.localeCompare(b.name, 'es'))){
    if (id !== 'plaintext') $viewAs.add(new Option(name, id));
  }
  const $blockFmt = document.getElementById('blockFmt');
  const $reloadBtn = document.getElementById('reloadBtn');
  const $saveBtn  = document.getElementById('saveBtn');
  const $saveAsLabel = document.getElementById('saveAsLabel');
  const $dlBtn    = document.getElementById('downloadBtn');
  const $downloadLabel = document.getElementById('downloadLabel');
  const $clearBtn = document.getElementById('clearBtn');

  const desktop = window.go?.main?.Desktop;
  function showDesktopMessage(text, question){
    return desktop.ShowMessage(text, question).catch(e => {
      console.error('No se pudo mostrar el mensaje:', e);
      return false;
    });

  const BINARY_EXT = /\.(png|jpe?g|gif|bmp|webp|ico|tiff?|heic|heif|avif|mp3|wav|ogg|flac|m4a|aac|opus|mp4|mov|avi|mkv|webm|wmv|flv|m4v|3gp|pdf|zip|rar|7z|gz|tgz|tar|bz2|xz|dmg|iso|exe|dll|so|dylib|bin|class|jar|war|pyc|pyo|o|obj|a|lib|doc|docx|xls|xlsx|ppt|pptx|odt|ods|odp|pages|numbers|keynote|ttf|otf|woff2?|eot|psd|ai|sketch|fig|xd|blend|fbx|stl|3ds|dae|glb|gltf|db|sqlite|sqlite3|mdb|accdb|wasm)$/i;
  const BINARY_MIME = /^(image\/(?!svg)|audio\/|video\/|font\/|model\/|application\/(pdf|zip|x-rar|x-7z|x-tar|gzip|x-bzip|x-xz|x-msdownload|x-executable|x-sharedlib|octet-stream$|vnd\.ms-|vnd\.openxmlformats-|vnd\.oasis\.opendocument|x-apple-|x-sqlite|wasm))/i;

  const namedFormats = new Map([

    ['mdx', 'markdown'], ['mdown', 'markdown'], ['mkdn', 'markdown'],
    ['h', 'c'], ['m', 'objectivec'], ['pl', 'perl'], ['pm', 'perl'],
    ['pyw', 'python'], ['pyi', 'python'], ['bash', 'bash'], ['zsh', 'bash'],

  function detectViewAs(name, text){
    const basename = name.split(/[\\/]/).pop().toLowerCase();
    const extension = /\.([^.]+)$/.exec(basename)?.[1] || '';
    const format = namedFormats.get(basename) ?? extensionFormats.get(extension)
      ?? languageIds.get(hljs.getLanguage(extension));
    if (format) return format === 'markdown' ? '' : format;

    // Use recognizable signatures for files without a known name or extension.
    const sampleLimit = 16384;
    const sample = text.slice(0, sampleLimit).trimStart();
    const shebang = /^#![ \t]*(\S+)(?:[ \t]+(?:-S[ \t]+)?([\w.-]+))?/.exec(sample);
    if (shebang){
      const command = shebang[1].split('/').pop();
      const interpreter = command === 'env' ? shebang[2] || '' : command;
      if (/^python(?:\d+(?:\.\d+)*)?$/.test(interpreter)) return 'python';
      if (/^(?:sh|bash|dash|ash|zsh|ksh)$/.test(interpreter)) return 'bash';
      if (/^(?:node|nodejs|deno|bun)$/.test(interpreter)) return 'javascript';

    if (/^<\?xml\b|^<!doctype\s+html\b|^<(?:html|svg)\b/i.test(sample)) return 'xml';

  const mdBlock = s => {
    s = String(s || '').trim();

  };
  const cleanMarkdown = s => String(s || '')
    .replace(/\u00a0/g, ' ')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trimEnd();
  const escapeMarkdownText = s => String(s || '')
    .replace(/\u00a0/g, ' ')
    .replace(/([\\*_`\[\]])/g, '\\$1');
  const inlineCodeMarkdown = s => {
    const text = String(s || '').replace(/\n+/g, ' ');
    const longest = Math.max(0, ...Array.from(text.matchAll(/`+/g), m => m[0].length));
    const fence = '`'.repeat(longest + 1);
    const pad = text.startsWith('`') || text.endsWith('`') ? ' ' : '';
    return fence + pad + text + pad + fence;
  };
  const childMarkdown = (nodes, ctx = {}) =>
    Array.from(nodes || []).map(node => nodeMarkdown(node, ctx)).join('');
  const inlineMarkdown = el => cleanMarkdown(childMarkdown(el.childNodes, { inline: true }));

  function tableMarkdown(table){
    const rows = Array.from(table.querySelectorAll('tr'))
      .map(row => Array.from(row.children).filter(c => /^(td|th)$/i.test(c.tagName)));
    if (!rows.length || !rows[0].length) return '';
    const width = Math.max(...rows.map(row => row.length));
    const cell = el => cleanMarkdown(childMarkdown(el.childNodes, { inline: true }))
      .replace(/\n+/g, ' ')
      .replace(/\|/g, '\\|')
      .trim();
    const line = cells => '| ' + Array.from({ length: width }, (_, i) => cell(cells[i] || document.createElement('td'))).join(' | ') + ' |';
    const out = [line(rows[0]), '| ' + Array.from({ length: width }, () => '---').join(' | ') + ' |'];
    for (const row of rows.slice(1)) out.push(line(row));
    return out.join('\n') + '\n\n';
  }

  function listMarkdown(list, ctx = {}){
    const depth = ctx.depth || 0;
    const ordered = list.tagName.toLowerCase() === 'ol';
    let index = parseInt(list.getAttribute('start') || '1', 10);
    if (!Number.isFinite(index)) index = 1;
    let out = '';
    for (const li of Array.from(list.children).filter(el => el.tagName.toLowerCase() === 'li')){
      const marker = ordered ? `${index++}. ` : '- ';
      out += listItemMarkdown(li, marker, depth);
    }
    return out + (ctx.listItem ? '' : '\n');
  }

  function listItemMarkdown(li, marker, depth){
    const main = document.createElement('div');
    const nested = [];
    for (const node of li.childNodes){
      if (node.nodeType === Node.ELEMENT_NODE && /^(ul|ol)$/i.test(node.tagName)){
        nested.push(node);
      } else {
        main.appendChild(node.cloneNode(true));
      }
    }
    const body = cleanMarkdown(childMarkdown(main.childNodes, { listItem: true, depth }))
      .replace(/\n{2,}/g, '\n');
    const lines = (body || '').split('\n');
    const indent = '  '.repeat(depth);
    const continuation = indent + ' '.repeat(marker.length);
    let out = indent + marker + (lines[0] || '') + '\n';
    for (const line of lines.slice(1)) out += continuation + line + '\n';
    for (const child of nested) out += listMarkdown(child, { listItem: true, depth: depth + 1 });
    return out;
  }

  function codeLanguage(code){
    return Array.from(code.classList).find(name => name.startsWith('language-'))?.slice(9) || '';
  }

  function fencedCodeMarkdown(code, language){
    const fence = '`'.repeat((code.match(/`{3,}/g) || [])
      .reduce((length, run) => Math.max(length, run.length + 1), 3));
    return fence + language + '\n' + (code ? code + '\n' : '') + fence;
  }

  function nodeMarkdown(node, ctx = {}){
    if (node.nodeType === Node.TEXT_NODE) return escapeMarkdownText(node.nodeValue);
    if (node.nodeType !== Node.ELEMENT_NODE) return '';
    const el = node;
    const tag = el.tagName.toLowerCase();
    if (tag === 'br') return '  \n';
    if (tag === 'input' && el.type === 'checkbox') return el.checked || el.hasAttribute('checked') ? '[x] ' : '[ ] ';
    if (tag === 'strong' || tag === 'b') return `**${inlineMarkdown(el)}**`;
    if (tag === 'em' || tag === 'i') return `*${inlineMarkdown(el)}*`;
    if (tag === 'del' || tag === 's') return `~~${inlineMarkdown(el)}~~`;
    if (tag === 'code'){
      if (el.parentElement && el.parentElement.tagName.toLowerCase() === 'pre') return el.textContent || '';
      return inlineCodeMarkdown(el.textContent || '');
    }
    if (tag === 'a'){
      const href = el.getAttribute('href') || '';
      const text = inlineMarkdown(el) || href;
      return href ? `[${text}](${href.replace(/\)/g, '\\)')})` : text;
    }
    if (tag === 'img'){
      const alt = el.getAttribute('alt') || '';
      const src = el.getAttribute('src') || '';
      return src ? `![${escapeMarkdownText(alt)}](${src.replace(/\)/g, '\\)')})` : '';
    }
    if (/^h[1-6]$/.test(tag)) return mdBlock(`${'#'.repeat(Number(tag[1]))} ${inlineMarkdown(el)}`);
    if (tag === 'p') return ctx.listItem ? inlineMarkdown(el) + '\n' : mdBlock(inlineMarkdown(el));
    if (tag === 'blockquote'){
      const body = cleanMarkdown(childMarkdown(el.childNodes, { depth: ctx.depth || 0 }));
      return body ? body.split('\n').map(line => line ? `> ${line}` : '>').join('\n') + '\n\n' : '';
    }
    if (tag === 'pre'){
      const code = el.querySelector('code') || el;
      return fencedCodeMarkdown(code.textContent.replace(/\n$/, ''), codeLanguage(code)) + '\n\n';
    }
    if (tag === 'ul' || tag === 'ol') return listMarkdown(el, ctx);
    if (tag === 'li') return listItemMarkdown(el, '- ', ctx.depth || 0);
    if (tag === 'table') return tableMarkdown(el);
    if (tag === 'hr') return '---\n\n';
    if (tag === 'thead' || tag === 'tbody' || tag === 'tfoot' || tag === 'tr') return childMarkdown(el.childNodes, ctx);
    if (tag === 'th' || tag === 'td') return inlineMarkdown(el);
    if (tag === 'div' || tag === 'section' || tag === 'article') return ctx.inline ? inlineMarkdown(el) : mdBlock(childMarkdown(el.childNodes, ctx));
    return childMarkdown(el.childNodes, ctx);
  }

  function htmlToMarkdown(root){
    const tmp = document.createElement('div');
    tmp.innerHTML = DOMPurify.sanitize(root.innerHTML, { ADD_ATTR: ['target'] });
    // Preserve blank lines and literal whitespace inside code during Markdown cleanup.
    let marker = '\uE000';
    while (tmp.innerHTML.includes(marker)) marker += '\uE000';
    const whitespace = [];
    tmp.querySelectorAll('pre').forEach(pre => {
      const code = pre.querySelector('code') || pre;
      const text = code.textContent.replace(/\n$/, '');
      code.textContent = text.replace(/\u00a0|[ \t]+$|^$/gm, part => {
        whitespace.push(part);
        return marker + (whitespace.length - 1) + ';';
      }) + '\n';
    });
    const text = cleanMarkdown(childMarkdown(tmp.childNodes))
      .replace(new RegExp(marker + '(\\d+);', 'g'), (_, index) => whitespace[index]);
    return text ? text + '\n' : '';
  }

  function navigationSurface(){
    return mode === 'split' || mode === 'edit' ? $editor : mode === 'wysiwyg' ? $wysiwyg : $content;
  }

  function textIndex(surface){
    if (surface === $editor) return { text: $editor.value };
    const walker = document.createTreeWalker(surface, NodeFilter.SHOW_TEXT);
    const entries = [];
    let text = '', previousBlock;
    for (let node; (node = walker.nextNode());){
      if (!node.length) continue;
      const block = node.parentElement.closest('p,li,pre,h1,h2,h3,h4,h5,h6,td,th,div');
      if (entries.length && block !== previousBlock) text += '\n';
      entries.push({ node, start: text.length });
      text += node.data;
      previousBlock = block;
    }
    return { text, entries };
  }

  function textRange(index, start, end = start){
    function point(offset){
      const entry = index.entries.findLast(item => item.start <= offset) || index.entries[0];
      return [entry.node, Math.min(entry.node.length, Math.max(0, offset - entry.start))];
    }
    const range = document.createRange();
    range.setStart(...point(start));
    range.setEnd(...point(end));
    return range;
  }

  // Match the textarea wrapping so navigation also works on narrow screens.
  function measureSource(read){
    const style = getComputedStyle($editor);
    const mirror = document.createElement('div');
    mirror.className = 'source-measure';
    Object.assign(mirror.style, {
      width: $editor.clientWidth + 'px', padding: style.padding,
      fontFamily: style.fontFamily, fontSize: style.fontSize, lineHeight: style.lineHeight,
      fontWeight: style.fontWeight, whiteSpace: style.whiteSpace,
      overflowWrap: style.overflowWrap, tabSize: style.tabSize,
    });
    const node = document.createTextNode($editor.value + '\u200b');
    mirror.append(node);
    document.body.append(mirror);
    const origin = mirror.getBoundingClientRect().top;
    const range = document.createRange();
    try {
      return read(offset => {
        range.setStart(node, offset);
        range.collapse(true);
        const rect = range.getBoundingClientRect();
        return rect.top - origin;
      });
    } finally { mirror.remove(); }
  }

  function revealSource(start, end = start){
    const top = measureSource(lineTop => lineTop(start));

  }

  function revealRange(range){
    const rect = range.getClientRects()[0];
    if (!rect) return;
    $body.scrollTop += rect.top - $body.getBoundingClientRect().top - $body.clientHeight / 3;
  }

  let findIndex = 0;
  function refreshFind(step = 0, reveal = false){
    CSS.highlights?.delete('document-current');
    if ($findBar.classList.contains('hidden') || !cur()) return;
    const surface = navigationSurface();
    const index = textIndex(surface);
    const query = $findText.value;
    const pattern = query && new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'giu');
    const matches = pattern ? Array.from(index.text.matchAll(pattern), match => match.index) : [];
    const count = matches.length;
    $findPrev.disabled = $findNext.disabled = !count;
    if (!count){
      $findStatus.textContent = query ? 'Sin coincidencias' : '';
      return;
    }
    findIndex = (findIndex % count + step + count) % count;
    $findStatus.textContent = `${findIndex + 1} de ${count}`;
    const start = matches[findIndex], end = start + query.length;
    if (surface === $editor){
      if (reveal) revealSource(start, end);
    } else {
      const range = textRange(index, start, end);
      if (CSS.highlights) CSS.highlights.set('document-current', new Highlight(range));
      if (reveal) revealRange(range);
    }
  }

  function toggleFind(open){

  $findText.addEventListener('input', () => { findIndex = 0; refreshFind(0, true); });

      e.preventDefault();

    }
