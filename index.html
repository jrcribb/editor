  $findNext.addEventListener('click', () => refreshFind(1, true));
  document.getElementById('findClose').addEventListener('click', () => toggleFind(false));

  function currentLine(){
    const surface = navigationSurface();
    if (surface === $editor){
      const text = $editor.value;
      const caret = $editor.selectionDirection === 'backward' ? $editor.selectionStart : $editor.selectionEnd;
      const offset = measureSource(top => {
        if (top(caret) >= $editor.scrollTop && top(caret) < $editor.scrollTop + $editor.clientHeight) return caret;
        let low = 0, high = text.length;
        while (low < high){
          const mid = (low + high) >>> 1;
          if (top(mid) < $editor.scrollTop) low = mid + 1;
          else high = mid;
        }
        return low;
      });
      return { mode, offset };
    }
    const { entries } = textIndex(surface);
    const viewport = $body.getBoundingClientRect();
    const selection = window.getSelection();
    const focus = selection?.focusNode;
    let entry = entries.find(item => item.node === focus);
    let column = entry ? selection.focusOffset : 0;
    if (entry){
      const rect = textRange({ entries }, entry.start + column).getBoundingClientRect();
      if (rect.top < viewport.top || rect.top >= viewport.bottom) entry = null;
    }
    if (!entry){
      const bounds = surface.getBoundingClientRect();
      const x = bounds.left + parseFloat(getComputedStyle(surface).paddingLeft) + 1;
      for (let y = viewport.top + 2; y < viewport.bottom; y += 10){
        const hit = document.caretRangeFromPoint(x, y);
        entry = hit && entries.find(item => item.node === hit.startContainer);
        if (entry){ column = hit.startOffset; break; }
      }
    }
    const offset = entry ? entry.start + column : 0;
    return { mode, offset };
  }

  function sameLine(first, second){
    if (navigationSurface() === $editor){
      if (!['edit', 'split'].includes(second.mode)) return false;
      const text = $editor.value;
      return text.slice(0, first.offset).lastIndexOf('\n') === text.slice(0, second.offset).lastIndexOf('\n');
    }
    if (first.mode !== second.mode) return false;
    const index = textIndex(navigationSurface());
    return !index.entries.length || Math.abs(
      textRange(index, first.offset).getBoundingClientRect().top -
      textRange(index, second.offset).getBoundingClientRect().top
    ) < 4;
  }

  function jumpToLine(location){
    const targetMode = location.mode === 'wysiwyg' && cur().viewAs ? 'view' : location.mode;
    if (mode !== targetMode) setMode(targetMode);
    const surface = navigationSurface();
    if (surface === $editor) revealSource(Math.min(location.offset, $editor.value.length));
    else {
      const index = textIndex(surface);
      if (!index.entries.length) return;
      const range = textRange(index, Math.min(location.offset, index.text.length));
      window.getSelection().collapse(range.startContainer, range.startOffset);
      revealRange(range);
    }
  }

  for (const button of [$pinLineBtn, $goLineBtn]){
    button.addEventListener('mousedown', e => e.preventDefault());
  }
  $pinLineBtn.addEventListener('click', () => {
    const f = cur();
    const here = currentLine();
    f.pin = f.pin && sameLine(here, f.pin) ? null : here;
    f.returnLine = null;
    updateToolbar();
  });
  $goLineBtn.addEventListener('click', () => {
    const f = cur();
    if (!f?.pin) return;
    const here = currentLine();
    if (sameLine(here, f.pin)){
      if (f.returnLine) jumpToLine(f.returnLine);
    } else {
      f.returnLine = here;
      jumpToLine(f.pin);
    }
  });

  function scrollProgress(pane){
    const range = pane.scrollHeight - pane.clientHeight;
    return range > 0 ? pane.scrollTop / range : null;
  }

  function setScrollProgress(pane, progress){
    if (progress !== null) pane.scrollTop = progress * (pane.scrollHeight - pane.clientHeight);
  }

  const splitScrollPositions = new WeakMap();
  function syncSplitScroll(source){
    const target = source === $editor ? $content : $editor;
    setScrollProgress(target, scrollProgress(source));
    // Scroll events from assigning scrollTop arrive later. Ignore the positions we just set.
    splitScrollPositions.set(source, source.scrollTop);
    splitScrollPositions.set(target, target.scrollTop);
  }

  for (const pane of [$editor, $content]){
    pane.addEventListener('scroll', () => {
      if (mode === 'split' && pane.scrollTop !== splitScrollPositions.get(pane)) syncSplitScroll(pane);
    }, { passive: true });
  }

  function setMode(m){
    if (!cur()) m = 'view';
    const previousMode = mode;
    if (m !== previousMode && cur()) cur().lastTyping = 0;
    const progress = previousMode === 'split' ? (scrollProgress($editor) ?? scrollProgress($content))
      : scrollProgress(previousMode === 'edit' ? $editor : $body);
    mode = m;
    $body.classList.toggle('edit',  m === 'edit');
    $body.classList.toggle('split', m === 'split');
    $body.classList.toggle('wysiwyg', m === 'wysiwyg');
    $richToolbar.classList.toggle('show', m !== 'view');
    $richToolbar.classList.toggle('source-only', m !== 'wysiwyg');
    $modeSeg.querySelectorAll('.btn').forEach(b => {
      const on = b.dataset.mode === m;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    if (m === 'edit' || m === 'split'){
      const f = cur();
      if (f && $editor.value !== f.text) $editor.value = f.text;
      setTimeout(() => $editor.focus({ preventScroll: true }), 0);
    }
    if (m === 'wysiwyg'){
      renderWysiwyg();
      setTimeout(() => $wysiwyg.focus(), 0);
    }
    if (m === 'view' || m === 'split') renderPreview();
    if (m === 'split'){
      setScrollProgress($editor, progress);
      setScrollProgress($content, progress);
      syncSplitScroll($editor);
    } else if (previousMode === 'split' && cur()){
      setScrollProgress(m === 'edit' ? $editor : $body, progress);
    }
    refreshFind();
  }

  function captureScroll(f){
    if (!f) return;
    f.scroll = {
      body:    $body.scrollTop,
      content: $content.scrollTop,
      editor:  $editor.scrollTop,
      wysiwyg: $wysiwyg.scrollTop,
      selStart: $editor.selectionStart,
      selEnd:   $editor.selectionEnd,
    };
  }

  function restoreScroll(f){
    const s = (f && f.scroll) || {};
    $body.scrollTop    = s.body    || 0;
    $content.scrollTop = s.content || 0;
    $editor.scrollTop  = s.editor  || 0;
    $wysiwyg.scrollTop = s.wysiwyg || 0;
    if (typeof s.selStart === 'number'){
      try { $editor.setSelectionRange(s.selStart, s.selEnd ?? s.selStart); }
      catch(_){}
    }
    if (mode === 'split') syncSplitScroll($editor);
  }

  function activate(id){
    if (id !== null && id === activeId){
      updateToolbar();
      renderSidebar();
      return;
    }
    const previous = cur();
    if (previous) previous.lastTyping = 0;
    captureScroll(previous);
    activeId = id;
    const f = cur();
    if (!f){
      toggleFind(false);
      $content.classList.add('welcome');
      $content.innerHTML = welcomeHTML;
      $editor.value = '';
      $wysiwyg.innerHTML = '';
      setMode('view'); updateToolbar(); renderSidebar();
      return;
    }
    const recentIndex = recentFileIds.indexOf(id);
    if (recentIndex !== -1) recentFileIds.splice(recentIndex, 1);
    recentFileIds.unshift(id);
    $content.classList.remove('welcome');
    $editor.value = f.text;
    if (mode === 'wysiwyg' && f.viewAs) setMode('split');
    else {
      renderPreview();
      if (mode === 'wysiwyg') renderWysiwyg();
    }
    updateToolbar();
    renderSidebar();
    restoreScroll(f);
    findIndex = 0;
    refreshFind();
  }

  async function closeFile(id){
    const f = files.find(file => file.id === id);
    if (!f || (f.dirty && !await ask(`"${f.name}" tiene cambios sin guardar. ¿Quieres cerrar el archivo?`))) return;
    const i = files.findIndex(f => f.id === id);
    if (i < 0) return;
    const wasActive = activeId === id;
    files.splice(i, 1);
    const recentIndex = recentFileIds.indexOf(id);
    if (recentIndex !== -1) recentFileIds.splice(recentIndex, 1);
    if (wasActive){
      activate(files[i]?.id || files[i-1]?.id || null);
    } else {
      renderSidebar(); updateToolbar();
    }
  }

  function updateHistoryButtons(f){
    $undoBtn.disabled = !f?.undo.length;
    $redoBtn.disabled = !f?.redo.length;
  }

  function updateText(f, text){
    movePinnedOffsets(f, text);
    f.text = text;
    f.size = new Blob([text]).size;
    const dirty = text !== f.savedText;
    if (dirty !== f.dirty){
      f.dirty = dirty;
      updateToolbar();
      renderSidebar();
    } else {
      $curSize.textContent = fmtBytes(f.size);
      updateHistoryButtons(f);
    }
  }

  function movePinnedOffsets(f, text){
    const marks = [f.pin, f.returnLine].filter(mark => mark && (mark.mode === 'split' || mark.mode === 'edit'));
    if (!marks.length) return;
    const before = f.text.replace(/\r\n?/g, '\n');
    const after = text.replace(/\r\n?/g, '\n');
    let start = 0, oldEnd = before.length, newEnd = after.length;
    while (start < oldEnd && start < newEnd && before[start] === after[start]) start++;
    while (oldEnd > start && newEnd > start && before[oldEnd - 1] === after[newEnd - 1]){
      oldEnd--; newEnd--;
    }
    for (const mark of marks){
      if (mark.offset >= oldEnd) mark.offset += newEnd - oldEnd;
      else if (mark.offset >= start) mark.offset = start;
    }
  }

  function recordEdit(f, text, inputType){
    const old = f.text;
    if (old === text) return false;
    // Keep only the changed span so typing in a large file does not store full copies.
    let start = 0, oldEnd = old.length, newEnd = text.length;
    while (start < oldEnd && start < newEnd && old[start] === text[start]) start++;
    while (oldEnd > start && newEnd > start && old[oldEnd - 1] === text[newEnd - 1]){
      oldEnd--; newEnd--;
    }
    const change = { start, removed: old.slice(start, oldEnd), inserted: text.slice(start, newEnd) };
    const previous = f.undo.at(-1);
    const typing = inputType === 'insertText' && !change.removed && !change.inserted.includes('\n');
    const now = performance.now();
    if (typing && f.lastTyping && now - f.lastTyping < 750 &&
        start === previous.start + previous.inserted.length){
      previous.inserted += change.inserted;
    } else {
      f.undo.push(change);
      if (f.undo.length > 100) f.undo.shift();
    }
    f.lastTyping = typing ? now : 0;
    f.redo.length = 0;
    updateText(f, text);
    return true;
  }

  function changeHistory(direction){
    const f = cur();
    const change = f?.[direction].pop();
    if (!change) return;
    const undo = direction === 'undo';
    const { start, removed, inserted } = change;
    const replacement = undo ? removed : inserted;
    const end = start + (undo ? inserted.length : removed.length);
    f[undo ? 'redo' : 'undo'].push(change);
    f.lastTyping = 0;
    updateText(f, f.text.slice(0, start) + replacement + f.text.slice(end));
    clearTimeout(renderTimer);

    if (mode === 'wysiwyg'){
      const scroll = $body.scrollTop;
      renderWysiwyg();
      $wysiwyg.focus({ preventScroll: true });
      $body.scrollTop = scroll;
    } else {
      const scroll = $editor.scrollTop;
      $editor.value = f.text;
      const caret = f.text.slice(0, start + replacement.length).replace(/\r\n/g, '\n').length;
      $editor.setSelectionRange(caret, caret);
      $editor.focus({ preventScroll: true });
      $editor.scrollTop = scroll;
      if (mode === 'split'){
        renderPreview();
        syncSplitScroll($editor);
      }
    }
    refreshFind();
  }

  for (const surface of [$editor, $wysiwyg]){
    surface.addEventListener('beforeinput', e => {
      if (!e.cancelable || !['historyUndo', 'historyRedo'].includes(e.inputType)) return;
      e.preventDefault();
      changeHistory(e.inputType === 'historyUndo' ? 'undo' : 'redo');
    });
  }

  function addFile(opts){
    const f = {
      id: nextId++,
      name: opts.name,
      size: opts.size ?? new Blob([opts.text]).size,
      text: opts.text,
      viewAs: detectViewAs(opts.name, opts.text),
      dirty: !!opts.dirty,
      savedText: opts.dirty ? null : opts.text,
      undo: [],
      redo: [],
      lastTyping: 0,
      handle: opts.handle || null,
      source: opts.source || null,
      lastModified: opts.lastModified || 0,
    };
    files.push(f);
    return f;
  }

  function addFromFileObject(file, handle){
    const opened = localFileQueue.then(() => readLocalFile(file, handle));
    localFileQueue = opened;
    return opened;
  }

  async function readLocalFile(file, handle){
    const name = file.name;
    const size = file.size;
    const lastModified = file.lastModified;
    try {
      if (handle?.isSameEntry){
        for (const f of files){
          if (f.handle && await handle.isSameEntry(f.handle).catch(() => false) && files.includes(f)) return f;
        }
      }
      if (size > MAX_FILE_SIZE &&
          !await ask(`"${name}" ocupa ${fmtBytes(size)}. Los archivos grandes pueden bloquear el navegador. ¿Quieres abrirlo?`)) return null;
      const text = await file.text();
      // Plain file inputs expose the original snapshot but no path or handle.
      const existing = files.find(f => (!handle || !f.handle) &&
        f.source?.name === name && f.source.size === size &&
        f.source.lastModified === lastModified && f.source.text === text);
      if (existing){
        if (handle) existing.handle = handle;
        return existing;
      }
      return addFile({ name, text, size, handle, lastModified, source: { name, size, lastModified, text } });
    } catch(e){
      console.error('read failed', file.name, e);
      if (desktop) await notify(`No se pudo abrir "${name}" (${e.message || e}).`);
      return null;
    }
  }

  async function addFileList(fileList){
    const all = Array.from(fileList);
    const added = [];
    for (const file of all){
      if (!isAcceptedFile(file)) continue;
      const f = await addFromFileObject(file);
      if (f) added.push(f);
    }
    if (added.length) activate(added[0].id);
    else { renderSidebar(); updateToolbar(); }
    if (all.length && !added.length) await notify('La selección parece contener solo archivos binarios.');
  }

  // Adapt native file IDs to the same handle contract used by the browser.
  function desktopHandle({ id, name }){
    let bom = false;
    let crlf = false;
    return {
      id, name,
      isSameEntry: async other => other.id === id,
      queryPermission: async () => 'granted',
      async getFile(){
        const info = await desktop.Stat(id);
        return { name, ...info, async text(){
          const raw = await desktop.Read(id);
          bom = raw.startsWith('\uFEFF');
          crlf = raw.includes('\r\n') && !/[\r\n]/.test(raw.replaceAll('\r\n', ''));
          return bom ? raw.slice(1) : raw;
        } };
      },
      async createWritable(){
        let text;
        return {
          write: async value => { text = value; },
          close: () => desktop.Write(id, (bom ? '\uFEFF' : '') + (crlf ? text.replace(/\r?\n/g, '\r\n') : text)),
        };
      },
    };
  }

  async function openHandles(handles){
    let first = null;
    let rejected = 0;
    for (const h of handles){
      try {
        const file = await h.getFile();
        if (!isAcceptedFile(file)){ rejected++; continue; }
        const f = await addFromFileObject(file, h);
        if (f && !first) first = f;
      } catch(e){
        console.error(e);
        if (desktop) await notify(`No se pudo abrir "${h.name}" (${e.message || e}).`);
      }
    }
    if (first) activate(first.id);
    else { renderSidebar(); updateToolbar(); }
    if (!first && rejected) await notify('La selección parece contener solo archivos binarios.');
    return first;
  }

  async function openDesktopFiles(result){
    const first = await openHandles((result.files || []).map(desktopHandle));
    if (result.errors?.length) await notify(`No se pudieron abrir algunas rutas:\n${result.errors.join('\n')}`);
    return first;
  }

  async function openFiles(){
    try {
      if (desktop) {
        if (await openDesktopFiles(await desktop.OpenFiles()) && mode === 'view') setMode('split');
        return;
      }
      await openHandles(await window.showOpenFilePicker({
        multiple: true,
        excludeAcceptAllOption: false,
      }));
    } catch(e){
      if (e.name !== 'AbortError'){
        console.error(e);
        if (desktop) await notify(`No se pudieron abrir los archivos (${e.message || e}).`);
      }
    }
  }

  document.getElementById('openBtn').addEventListener('click', () => {
    if (hasFSA) openFiles(); else $input.click();
  });
  $input.addEventListener('change', e => {
    const list = Array.from(e.target.files);
    $input.value = '';
    addFileList(list);
  });

  document.getElementById('newBtn').addEventListener('click', () => {
    const f = addFile({ name: 'Sin título.md', text: '# Nuevo documento\n\n', dirty: true });
    activate(f.id);
    setMode('edit');
  });

  document.getElementById('clearBtn').addEventListener('click', async () => {
    const dirty = files.some(f => f.dirty);
    if (dirty && !await ask('¿Quieres cerrar todos los archivos? Se perderán los cambios sin guardar.')) return;
    files.length = 0; recentFileIds.length = 0; activate(null);
  });
  $openFileSelect.addEventListener('change', () => activate(Number($openFileSelect.value)));
  $previousFileBtn.addEventListener('click', () => {
    if (recentFileIds[1] !== undefined) activate(recentFileIds[1]);
  });

  const isFilesDrag = e => {
    const types = e.dataTransfer?.types;
    if (!types) return false;
    if (typeof types.includes === 'function') return types.includes('Files');
    for (let i = 0; i < types.length; i++) if (types[i] === 'Files') return true;
    return false;
  };
  let dragHideTimer = null;
  const showDropzone = () => {
    clearTimeout(dragHideTimer); dragHideTimer = null;
    $drop.classList.add('active');
  };
  const hideDropzone = () => {
    clearTimeout(dragHideTimer); dragHideTimer = null;
    $drop.classList.remove('active');
  };
  window.addEventListener('dragenter', e => {
    if (!isFilesDrag(e)) return;
    showDropzone();
  });
  window.addEventListener('dragover', e => {
    if (!isFilesDrag(e)) return;
    e.preventDefault();
    showDropzone();
  });
  window.addEventListener('dragleave', e => {
    if (e.relatedTarget) return;
    clearTimeout(dragHideTimer);
    dragHideTimer = setTimeout(hideDropzone, 80);
  });
  window.addEventListener('drop', async e => {
    e.preventDefault(); hideDropzone();
    if (desktop && window.runtime.CanResolveFilePaths()) return;
    const entries = [];
    const items = e.dataTransfer?.items;
    if (items && items.length){
      for (const it of items){
        if (it.kind !== 'file') continue;
        const file = it.getAsFile();
        if (!file) continue;
        let handlePromise = null;
        if (typeof it.getAsFileSystemHandle === 'function'){
          try { handlePromise = it.getAsFileSystemHandle(); } catch(_) {}
        }
        entries.push({ file, handlePromise });
      }
    }
    if (!entries.length && e.dataTransfer?.files?.length){
      for (const file of e.dataTransfer.files) entries.push({ file, handlePromise: null });
    }
    const added = [];
    let rejected = 0;
    for (const { file, handlePromise } of entries){
      if (!isAcceptedFile(file)){ rejected++; continue; }
      let handle = null;
      if (handlePromise){
        try { const h = await handlePromise; if (h && h.kind === 'file') handle = h; } catch(_) {}
      }
      const f = await addFromFileObject(file, handle);
      if (f) added.push(f);
    }
    if (added.length) activate(added[0].id);
    else { renderSidebar(); updateToolbar(); }
    if (!added.length && rejected) await notify('Los archivos que soltaste parecen ser todos binarios.');
  });

  window.addEventListener('paste', async e => {
    if ($codeBlockDialog.open || $linkDialog.open || document.activeElement === $editor ||
        $findBar.contains(document.activeElement) || $wysiwyg.contains(document.activeElement)) return;
    const cd = e.clipboardData;
    const pastedFiles = [];
    if (cd?.items){
      for (const it of cd.items){
        if (it.kind === 'file'){
          const file = it.getAsFile();
          if (file) pastedFiles.push(file);
        }
      }
    }
    if (!pastedFiles.length && cd?.files?.length){
      for (const file of cd.files) pastedFiles.push(file);
    }
    const acceptedFiles = pastedFiles.filter(isAcceptedFile);
    if (acceptedFiles.length){
      e.preventDefault();
      const added = [];
      for (const file of acceptedFiles){
        const f = await addFromFileObject(file);
        if (f) added.push(f);
      }
      if (added.length) activate(added[0].id);
      else { renderSidebar(); updateToolbar(); }
      return;
    }
    if (pastedFiles.length){
      e.preventDefault();
      return;
    }
    const t = cd?.getData('text/plain');
    if (!t || t.length < 2) return;
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    const f = addFile({
      name: `Texto pegado ${stamp}.md`,
      text: t,
      dirty: true,
    });
    activate(f.id);
  });

  $modeSeg.addEventListener('click', e => {
    const b = e.target.closest('[data-mode]');
    if (b) setMode(b.dataset.mode);
  });

  $viewAs.addEventListener('change', () => {
    const f = cur(); if (!f) return;
    for (const key of ['pin', 'returnLine']){
      if (f[key] && !['edit', 'split'].includes(f[key].mode)) f[key] = null;
    }
    f.viewAs = $viewAs.value;
    updateToolbar();
    if (mode === 'edit' || mode === 'wysiwyg') setMode('split');
    else {
      renderPreview();
      if (mode === 'split') syncSplitScroll($editor);
    }
    refreshFind();
  });

  $editor.addEventListener('input', e => {
    const f = cur(); if (!f) return;
    if (!recordEdit(f, $editor.value, e.inputType)) return;
    refreshFind();
    if (mode === 'split'){
      clearTimeout(renderTimer);
      renderTimer = setTimeout(() => {
        if (cur() !== f || mode !== 'split') return;
        renderPreview();
        syncSplitScroll($editor);
      }, 120);
    }
  });

  $editor.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 's'){
      e.preventDefault(); e.stopPropagation();
      doSave();
      return;
    }
    if (e.key !== 'Tab') return;
    e.preventDefault();
    const s = $editor.selectionStart, t = $editor.selectionEnd;
    const v = $editor.value;
    const spansLines = v.slice(s, t).includes('\n');
    if (spansLines){
      const lineStart = v.lastIndexOf('\n', s - 1) + 1;
      const block = v.slice(lineStart, t);
      const replaced = e.shiftKey
        ? block.replace(/^ {1,2}/gm, '')
        : block.replace(/^/gm, '  ');
      $editor.setRangeText(replaced, lineStart, t);
      $editor.selectionStart = lineStart;
      $editor.selectionEnd = lineStart + replaced.length;
    } else if (e.shiftKey){
      const lineStart = v.lastIndexOf('\n', s - 1) + 1;
      const head = v.slice(lineStart, lineStart + 2);
      const strip = head.startsWith('  ') ? 2 : (head.startsWith(' ') ? 1 : 0);
      if (strip){
        $editor.setRangeText('', lineStart, lineStart + strip);
        $editor.selectionStart = Math.max(lineStart, s - strip);
        $editor.selectionEnd = Math.max(lineStart, t - strip);
      }
    } else {
      $editor.setRangeText('  ', s, t, 'end');
    }
    $editor.dispatchEvent(new Event('input'));
  });

  let savedRichRange = null;
  const wysiwygNode = node => {
    if (!node) return null;
    return node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
  };
  const selectionInWysiwyg = () => {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return false;
    const node = wysiwygNode(sel.getRangeAt(0).commonAncestorContainer);
    return node === $wysiwyg || $wysiwyg.contains(node);
  };
  function saveRichSelection(){
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount || !selectionInWysiwyg()) return;
    savedRichRange = sel.getRangeAt(0).cloneRange();
  }
  function restoreRichSelection(){
    $wysiwyg.focus();
    if (!savedRichRange) return;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRichRange);
  }
  function syncFromWysiwyg(e){
    const f = cur(); if (!f) return;
    recordEdit(f, htmlToMarkdown($wysiwyg), e?.inputType);
    saveRichSelection();
    refreshFind();
  }
  function updateBlockFormat(){
    if (!$blockFmt || mode !== 'wysiwyg') return;
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount || !selectionInWysiwyg()) return;
    let el = wysiwygNode(sel.anchorNode);
    while (el && el !== $wysiwyg){
      const tag = el.tagName.toLowerCase();
      if (/^(h1|h2|h3|blockquote|pre|p|li|div)$/.test(tag)){
        $blockFmt.value = tag === 'li' || tag === 'div' ? 'p' : tag;
        return;
      }
      el = el.parentElement;
    }
    $blockFmt.value = 'p';
  }
  function richCommand(cmd){
    restoreRichSelection();
    if (cmd === 'link'){ openLinkDialog(); return; }
    if (cmd === 'bold') document.execCommand('bold');
    else if (cmd === 'italic') document.execCommand('italic');
    else if (cmd === 'ul') document.execCommand('insertUnorderedList');
    else if (cmd === 'ol') document.execCommand('insertOrderedList');
    else if (cmd === 'code') applyInlineCode();
    syncFromWysiwyg();
    updateBlockFormat();
  }
  function openCodeBlockDialog(){
    const rich = mode === 'wysiwyg';
    if (rich) restoreRichSelection();
    const selection = window.getSelection();
    const start = $editor.selectionStart, end = $editor.selectionEnd;
    const existing = rich && selection.isCollapsed && selectionInWysiwyg()
      ? wysiwygNode(selection.anchorNode)?.closest('pre')
      : null;
    $codeLanguage.value = existing ? codeLanguage(existing.querySelector('code') || existing) : '';
    $codeBlockText.value = rich
      ? (existing ? existing.textContent.replace(/\n$/, '') : selectionInWysiwyg() ? selection.toString() : '')
      : $editor.value.slice(start, end);
    $codeBlockDialog.returnValue = '';
    $codeBlockDialog.addEventListener('close', () => {
      if ($codeBlockDialog.returnValue !== 'aplicar') return;
      const language = $codeLanguage.value.toLowerCase();
      const code = $codeBlockText.value;
      if (rich){
        restoreRichSelection();
        const classes = language ? ' class="language-' + escHtml(language) + '"' : '';
        const html = '<pre><code' + classes + '>' + escHtml(code + '\n') + '</code></pre>';
        if (existing){
          existing.outerHTML = html;
        } else {
          document.execCommand('insertHTML', false, html);
        }
        highlightCodeBlocks($wysiwyg);
        syncFromWysiwyg();
        updateBlockFormat();
      } else {
        const before = start > 0 && $editor.value[start - 1] !== '\n' ? '\n\n' : '';
        const after = end < $editor.value.length && $editor.value[end] !== '\n' ? '\n\n' : '';
        $editor.setRangeText(before + fencedCodeMarkdown(code, language) + after, start, end, 'end');
        $editor.focus();
        $editor.dispatchEvent(new Event('input'));
      }
    }, { once: true });
    $codeBlockDialog.showModal();
  }

  function applyInlineCode(){
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    const code = document.createElement('code');
    code.textContent = range.collapsed ? 'código' : range.toString();
    range.deleteContents();
    range.insertNode(code);
    range.setStartAfter(code);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }
  function openLinkDialog(){
    const f = cur();
    const sel = window.getSelection();
    const insertText = sel && sel.rangeCount && sel.getRangeAt(0).collapsed;
    saveRichSelection();
    $linkUrl.value = $linkText.value = '';
    $linkTextField.hidden = !insertText;
    $linkDialog.returnValue = '';
    $linkDialog.addEventListener('close', () => {
      if (cur() !== f || mode !== 'wysiwyg') return;
      restoreRichSelection();
      if ($linkDialog.returnValue !== 'aplicar') return;
      const href = $linkUrl.value.trim();
      if (!href) document.execCommand('unlink');
      else if (insertText){
        document.execCommand('insertHTML', false, `<a href="${escHtml(href)}">${escHtml($linkText.value || href)}</a>`);
      } else document.execCommand('createLink', false, href);
      syncFromWysiwyg();
      updateBlockFormat();
    }, { once: true });
    $linkDialog.showModal();
  }
  function setRichBlock(tag){
    restoreRichSelection();
    document.execCommand('formatBlock', false, tag);
    syncFromWysiwyg();
    updateBlockFormat();
  }

  $wysiwyg.addEventListener('input', syncFromWysiwyg);
  $wysiwyg.addEventListener('keyup', () => { saveRichSelection(); updateBlockFormat(); });
  $wysiwyg.addEventListener('mouseup', () => { saveRichSelection(); updateBlockFormat(); });
  $wysiwyg.addEventListener('paste', e => {
    e.preventDefault();
    const html = e.clipboardData?.getData('text/html');
    const text = e.clipboardData?.getData('text/plain') || '';
    if (html){
      document.execCommand('insertHTML', false, DOMPurify.sanitize(html));
    } else {
      document.execCommand('insertText', false, text);
    }
    syncFromWysiwyg();
  });
  $wysiwyg.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;
    if (!mod) return;
    const k = e.key.toLowerCase();
    if (k === 's'){ e.preventDefault(); e.stopPropagation(); doSave(); }
    else if (k === 'k'){ e.preventDefault(); e.stopPropagation(); richCommand('link'); }
  });
  $richToolbar.addEventListener('mousedown', e => {
    if (e.target.closest('button')) e.preventDefault();
  });
  $richToolbar.addEventListener('click', e => {
    const history = e.target.closest('[data-history]');
    if (history){ changeHistory(history.dataset.history); return; }
    const btn = e.target.closest('[data-rich-cmd]');
    if (btn?.dataset.richCmd === 'codeBlock') openCodeBlockDialog();
    else if (btn) richCommand(btn.dataset.richCmd);
  });
  $blockFmt.addEventListener('change', () => setRichBlock($blockFmt.value));
  document.addEventListener('selectionchange', () => {
    if (mode !== 'wysiwyg') return;
    saveRichSelection();
    updateBlockFormat();
  });

  async function ensureReadPermission(handle){
    if (!handle) return false;
    if (!handle.queryPermission || !handle.requestPermission) return true;
    const perm = await handle.queryPermission({ mode: 'read' });
    if (perm === 'granted') return true;
    return await handle.requestPermission({ mode: 'read' }) === 'granted';
  }

  async function doReload(){
    const f = cur();
    if (!f) return;
    if (!f.handle){
      await notify('Para habilitar la recarga, usa Abrir archivos en un navegador basado en Chromium.');
      return;
    }
    if (f.dirty && !await ask(`"${f.name}" tiene cambios sin guardar. ¿Quieres sustituirlos por la versión guardada?`)) return;

    $reloadBtn.classList.add('busy');
    $reloadBtn.disabled = true;
    try {
      if (!await ensureReadPermission(f.handle)) throw new Error('permiso denegado');
      const file = await f.handle.getFile();
      if (!isAcceptedFile(file)) throw new Error('el archivo ya no parece ser de texto o Markdown');
      if (file.size > MAX_FILE_SIZE &&
          !await ask(`"${file.name}" ocupa ${fmtBytes(file.size)}. Los archivos grandes pueden bloquear el navegador. ¿Quieres recargarlo?`)){
        return;
      }
      const text = await file.text();
      f.name = file.name || f.handle.name || f.name;
      movePinnedOffsets(f, text);
      f.text = text;
      f.savedText = text;
      f.undo.length = 0;
      f.redo.length = 0;
      f.lastTyping = 0;
      f.size = file.size;
      f.lastModified = file.lastModified || Date.now();
      f.source = { name: f.name, size: file.size, lastModified: file.lastModified, text };
      f.dirty = false;
      if (activeId === f.id){
        $editor.value = f.text;
        if (mode === 'wysiwyg') renderWysiwyg();
        else {
          renderPreview();
          if (mode === 'split') syncSplitScroll($editor);
        }
      }
      updateToolbar();
      renderSidebar();
      refreshFind();
    } catch(e){
      console.error('reload failed', e);
      await notify(`No se pudo recargar "${f.name}" (${e && e.message || e}).`);
    } finally {
      $reloadBtn.classList.remove('busy');
      updateToolbar();
      renderSidebar();
    }
  }

  async function chooseSaveHandle(name){
    if (!desktop) return window.showSaveFilePicker({ suggestedName: name });
    const target = await desktop.SaveTarget(name);
    return target ? desktopHandle(target) : null;
  }

  async function doSave(saveAs = false){
    const f = cur(); if (!f || !f.dirty || f.saving) return;
    const original = typeof f.handle?.createWritable === 'function' ? f.handle : null;
    if (saveAs ? !hasSavePicker : !original) return;
    const text = f.text;
    f.lastTyping = 0;
    f.saving = true;
    $saveBtn.disabled = true;
    try {
      let handle;
      if (saveAs){
        handle = await chooseSaveHandle(f.name);
        if (!handle) return;
      } else {
        handle = original;
        const perm = await handle.queryPermission?.({ mode: 'readwrite' });
        if (perm !== 'granted'){
          const req = await handle.requestPermission?.({ mode: 'readwrite' });
          if (req !== 'granted') throw new Error('permiso denegado');
        }
      }
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      f.handle = handle;
      f.name = handle.name || f.name;
      f.lastModified = Date.now();
      f.savedText = text;
      f.dirty = f.text !== text;
    } catch(e){
      if (saveAs && e.name === 'AbortError') return;
      console.error('save failed', e);
      const target = saveAs ? 'el archivo elegido' : 'el archivo original';
      await notify(`No se pudo guardar en ${target} (${e.message || e}). Puedes descargar una copia.`);
    } finally {
      f.saving = false;
      updateToolbar();
      renderSidebar();
    }
  }

  async function triggerDownload(f){
    if (desktop){
      const text = f.text;
      try {
        const handle = await chooseSaveHandle(f.name);
        if (!handle) return;
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();
      } catch(e){
        await notify(`No se pudo guardar la copia (${e.message || e}).`);
      }
      return;
    }
    const mime = ACCEPTED_EXT.test(f.name) ? 'text/markdown' : 'text/plain';
    const blob = new Blob([f.text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = /\.[^./\\]+$/.test(f.name) ? f.name : (f.name + '.md');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  $reloadBtn.addEventListener('click', doReload);
  $saveBtn.addEventListener('click', () => doSave(!$saveAsLabel.hidden));
  $dlBtn.addEventListener('click', () => { const f = cur(); if (f) triggerDownload(f); });

  window.addEventListener('keydown', e => {
    if ($codeBlockDialog.open || $linkDialog.open) return;
    const mod = e.metaKey || e.ctrlKey;
    if (!mod) return;
    const k = e.key.toLowerCase();
    const focus = document.activeElement;
    if (k === 'f' && cur() && !e.altKey){ e.preventDefault(); toggleFind(true); }
    else if (!e.altKey && (k === 'z' || k === 'y') &&
        (focus === $editor || $wysiwyg.contains(focus) || $richToolbar.contains(focus))){
      e.preventDefault();
      changeHistory(k === 'y' || e.shiftKey ? 'redo' : 'undo');
    }
    else if (k === 'o'){ e.preventDefault(); document.getElementById('openBtn').click(); }
    else if (k === 'w' && activeId){ e.preventDefault(); closeFile(activeId); }
    else if (k === 's' && activeId){ e.preventDefault(); $saveBtn.click(); }
    else if (k === 'e' && activeId){ e.preventDefault();
      setMode(mode === 'edit' ? 'view' : 'edit'); }
  });

  window.addEventListener('beforeunload', e => {
    if (!desktop && files.some(f => f.dirty)){ e.preventDefault(); e.returnValue = true; }
  });

  let sessionDB;
  let rememberedHandles = null;
  function browserSessionDB(){
    if (!sessionDB){
      sessionDB = new Promise((resolve, reject) => {
        const request = indexedDB.open('mdv-session', 1);
        request.onupgradeneeded = () => request.result.createObjectStore('session');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }
    return sessionDB;
  }

  function rememberBrowserFiles(){
    if (!rememberedHandles) return;
    const handles = files.map(f => f.handle).filter(handle => handle?.kind === 'file');
    if (handles.length === rememberedHandles.length && handles.every((h, i) => h === rememberedHandles[i])) return;
    rememberedHandles = handles;
    browserSessionDB().then(db => {
      const transaction = db.transaction('session', 'readwrite');
      transaction.onerror = () => console.warn('No se pudo guardar la lista de archivos.', transaction.error);
      transaction.objectStore('session').put(handles, 'files');
    }).catch(e => console.warn('No se pudo guardar la lista de archivos.', e));
  }

  async function restoreBrowserFiles(){
    try {
      const db = await browserSessionDB();
      const stored = await new Promise((resolve, reject) => {
        const request = db.transaction('session').objectStore('session').get('files');
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
      const handles = [];
      for (const handle of stored){
        if (await handle.queryPermission({ mode: 'read' }).catch(() => 'denied') === 'granted') handles.push(handle);
      }
      if (!files.length && handles.length && !new URLSearchParams(location.search).has('fetch')){
        await openHandles(handles);
      }
      rememberedHandles = files.map(f => f.handle).filter(handle => handle?.kind === 'file');
      if (files.some(f => f.handle && !handles.includes(f.handle))){
        rememberedHandles = [];
        rememberBrowserFiles();
      }
    } catch(e) { console.warn('No se pudo recuperar la lista de archivos.', e); }
  }

  const STORE_KEY = 'mdv.panes.v1';
  const $app = document.getElementById('app');
  const $sideResizer = document.getElementById('sideResizer');
  const $splitResizer = document.getElementById('splitResizer');
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
  const readPanes = () => {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch(_){ return {}; }
  };
  const writePanes = p => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch(_){}
  };
  const panes = readPanes();
  const $sidebarToggle = document.getElementById('sidebarToggle');
  document.documentElement.style.setProperty('--brand-image', 'url("' + document.querySelector('link[rel="icon"]').href + '")');
  function setMenuCollapsed(collapsed){
    $app.classList.toggle('menu-collapsed', collapsed);
    $sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
    $sidebarToggle.title = collapsed ? 'Expandir menú' : 'Contraer menú';
    $sidebarToggle.setAttribute('aria-label', $sidebarToggle.title);
  }
  setMenuCollapsed(panes.menuCollapsed === true);
  $sidebarToggle.addEventListener('click', () => {
    panes.menuCollapsed = !$app.classList.contains('menu-collapsed');
    setMenuCollapsed(panes.menuCollapsed);
    writePanes(panes);
  });
  if (typeof panes.sidebar === 'number'){
    const w = clamp(panes.sidebar, 180, Math.max(240, window.innerWidth - 320));
    document.documentElement.style.setProperty('--sidebar-w', w + 'px');
  }
  if (typeof panes.split === 'number'){
    const pct = clamp(panes.split, 10, 90);
    document.documentElement.style.setProperty('--split-w', pct + '%');
  }

  function makeResizer(el, onMove){
    let active = false;
    el.addEventListener('pointerdown', e => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      active = true;
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      e.preventDefault();
    });
    el.addEventListener('pointermove', e => {
      if (!active) return;
      onMove(e.clientX);
    });
    const end = e => {
      if (!active) return;
      active = false;
      try { el.releasePointerCapture(e.pointerId); } catch(_){}
      el.classList.remove('dragging');
      document.body.style.cursor = '';
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('dblclick', () => {
      onMove(null);
    });
    el.addEventListener('keydown', e => {
      const step = e.shiftKey ? 40 : 16;
      if (e.key === 'ArrowLeft'){ e.preventDefault(); onMove('nudge', -step); }
      else if (e.key === 'ArrowRight'){ e.preventDefault(); onMove('nudge', step); }
      else if (e.key === 'Home'){ e.preventDefault(); onMove(null); }
    });
  }

  makeResizer($sideResizer, (x, delta) => {
    const maxW = Math.max(240, window.innerWidth - 320);
    let w;
    if (x === null){ w = 280; }
    else if (x === 'nudge'){
      w = parseFloat(getComputedStyle($sideResizer.previousElementSibling).width) + delta;
    } else {
      w = x - $app.getBoundingClientRect().left;
    }
    w = clamp(w, 180, maxW);
    document.documentElement.style.setProperty('--sidebar-w', w + 'px');
    panes.sidebar = w;
    writePanes(panes);
  });

  makeResizer($splitResizer, (x, delta) => {
    const rect = $body.getBoundingClientRect();
    if (!rect.width) return;
    let pct;
    if (x === null){ pct = 50; }
    else if (x === 'nudge'){
      const cur = parseFloat(getComputedStyle($editor).width) / rect.width * 100;
      pct = cur + (delta / rect.width) * 100;
    } else {
      pct = (x - rect.left) / rect.width * 100;
    }
    pct = clamp(pct, 10, 90);
    document.documentElement.style.setProperty('--split-w', pct + '%');
    panes.split = pct;
    writePanes(panes);
  });

  window.addEventListener('resize', () => {
    if (typeof panes.sidebar === 'number'){
      const maxW = Math.max(240, window.innerWidth - 320);
      const w = clamp(panes.sidebar, 180, maxW);
      document.documentElement.style.setProperty('--sidebar-w', w + 'px');
    }
  });

  $content.innerHTML = welcomeHTML;
  renderSidebar(); updateToolbar();

  if (desktop){
    let closing = false;
    window.runtime.EventsOn('editor:close', async () => {
      if (closing || files.some(f => f.saving)) return;
      closing = true;
      try {
        if (files.some(f => f.dirty) && !await ask('Hay cambios sin guardar. ¿Quieres cerrar el editor?')) return;
        const ids = files.map(f => f.handle?.id).filter(id => id !== undefined);
        await desktop.SaveSession(ids).catch(e => console.warn('No se pudo guardar la lista de archivos.', e));
        await desktop.CloseWindow();
      } finally { closing = false; }
    });
    window.runtime.OnFileDrop(() => {}, false);
    window.runtime.EventsOn('editor:drop', async result => {
      if (await openDesktopFiles(result) && mode === 'view') setMode('split');
    });
    // Keep navigation inside the editor limited to document anchors.
    const openLink = e => {
      const link = e.target.closest('a[href]');
      const href = link?.getAttribute('href');
      if (href == null || href.startsWith('#')) return;
      e.preventDefault();
      if (/^(https?:|mailto:|\/\/)/i.test(href)) window.runtime.BrowserOpenURL(link.href);
    };
    $content.addEventListener('click', openLink, true);
    $content.addEventListener('auxclick', openLink, true);
    desktop.StartupFiles().then(async result => {
      if (await openDesktopFiles(result)) setMode('split');
    }).catch(e => notify(`No se pudieron abrir los archivos (${e.message || e}).`));
  } else if (hasFSA && window.indexedDB) restoreBrowserFiles();

  // URL loader: ?fetch=<url>&name=<display name> (repeatable) — lets other local
  // tools (e.g. Project City, http://127.0.0.1:8129/) open file contents directly.
  (async () => {
    const q = new URLSearchParams(location.search);
    const urls = q.getAll('fetch');
    if (!urls.length) return;
    const names = q.getAll('name');
    const added = [];
    for (let i = 0; i < urls.length; i++){
      try {
        const r = await fetch(urls[i]);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const text = await r.text();
        const path = new URL(urls[i], location.href).pathname;
        added.push(addFile({ name: names[i] || decodeURIComponent(path.split('/').pop() || 'archivo.md'), text }));
      } catch(e){ console.error('?fetch= load failed', urls[i], e); }
    }
    if (added.length) activate(added[0].id);
  })();
})();
</script>
</body>
</html>
